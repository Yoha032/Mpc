<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pad 16 Sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">

<style>
/* Layout: hardware sampler chassis. LCD + parameter strip on the left, 4x4 rubber pads on the right; stacked LCD / pads / parameters on phones. */
:root{
  color-scheme: dark;
  --bg:#131416;
  --chassis:#2b2c2f;
  --chassis-hi:#37383c;
  --chassis-lo:#1f2022;
  --key:#3a3b3f;
  --key-hi:#47484d;
  --ink:#e9e6dc;
  --ink-dim:#9b998f;
  --rubber-hi:#2c2d30;
  --rubber-lo:#1a1b1d;
  --led:#ff9a1f;
  --ui:#ffb02e;
  --f-label:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-lcd:'VT323',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-label);
  font-size:16px;
  padding-block:20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  margin: 0;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}

.mpc{
  max-width:1040px;margin:0 auto;display:grid;gap:16px;padding:18px;border-radius:14px;
  background:linear-gradient(180deg,var(--chassis-hi) 0,var(--chassis) 28%,var(--chassis-lo) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 24px 48px rgba(0,0,0,.55),0 0 0 1px #0b0b0c;
}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:30px;font-weight:700;letter-spacing:.08em;line-height:1}
.brand span{font-size:14px;letter-spacing:.3em;color:var(--ink-dim)}
.banks{display:flex;gap:8px}
.btn{
  appearance:none;border:0;cursor:pointer;min-height:40px;padding:6px 14px;border-radius:5px;
  background:linear-gradient(180deg,var(--key-hi),var(--key));
  box-shadow:0 3px 0 #0b0b0c,0 4px 8px #0007,inset 0 1px 0 rgba(255,255,255,.14);
  font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;position:relative;
  transition:transform .04s,box-shadow .04s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0b0c,0 2px 4px #0007,inset 0 1px 0 rgba(255,255,255,.1)}
.btn[aria-pressed="true"]{color:#fff;box-shadow:0 3px 0 #0b0b0c,0 4px 8px #0007,inset 0 1px 0 rgba(255,255,255,.14),inset 0 -3px 0 var(--ui)}
.banks .btn{width:46px;padding:6px 0;font-size:18px}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* knobs */
.knobcell{display:flex;flex-direction:column;align-items:center;gap:6px}
.lab{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--ink-dim);text-transform:uppercase}
.knob{
  width:62px;height:62px;border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;
  background:radial-gradient(circle at 35% 28%,#54555a,#232427 68%);
  box-shadow:0 4px 8px #000a,inset 0 1px 0 rgba(255,255,255,.18),0 0 0 3px #161719;
}
.knob i{position:absolute;left:50%;top:7px;width:3px;height:15px;margin-left:-1.5px;border-radius:2px;background:var(--ink);transform-origin:50% 24px}
.knobcell output{font-family:var(--f-lcd);font-size:20px;line-height:1;color:var(--ink);min-width:3ch;text-align:center}
.mini .knob{width:50px;height:50px}
.mini .knob i{top:6px;height:12px;transform-origin:50% 19px}

/* deck */
.deck{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"lcd" "pads" "ctl"}
@media (min-width:860px){
  .deck{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"lcd pads" "ctl pads";align-items:start}
}

/* LCD */
.lcd{
  grid-area:lcd;position:relative;overflow:hidden;border-radius:6px;padding:10px 12px 12px;
  --lcd-bg:#a8b88a;--lcd-fg:#1d2813;--lcd-glow:transparent;
  background:var(--lcd-bg);color:var(--lcd-fg);text-shadow:0 0 7px var(--lcd-glow);
  font-family:var(--f-lcd);font-size:24px;line-height:1.05;
  box-shadow:inset 0 2px 12px #0007,0 0 0 4px #151618,0 1px 0 4px rgba(255,255,255,.07);
}
.lcd[data-lcd="amber"]{--lcd-bg:#140c03;--lcd-fg:#ffb02e;--lcd-glow:#ff8a1f99}
.lcd[data-lcd="ice"]{--lcd-bg:#08182a;--lcd-fg:#86d9ff;--lcd-glow:#3fb6ff88}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px)}
.lrow{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:14px;row-gap:2px}
.lrow.head{flex-wrap:nowrap;border-bottom:2px solid currentColor;padding-bottom:4px;margin-bottom:6px;gap:12px}
#lcdName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lcdState{white-space:nowrap}
.wave{display:block;width:100%;height:96px;margin:2px 0 6px}
.lrow span{white-space:nowrap}

/* parameter panel */
.ctl{grid-area:ctl;display:grid;gap:16px;padding:14px;border-radius:8px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px #0007}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.field .lab{display:block;margin-bottom:6px}
.namein{
  flex:1;min-width:0;height:42px;padding:0 12px;border:0;border-radius:5px;background:#101113;
  box-shadow:inset 0 2px 5px #000b,0 0 0 1px #3a3b3f;font-size:18px;letter-spacing:.06em;text-transform:uppercase
}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn{padding:6px 12px}
.sw{display:flex;gap:10px}
.sw button{
  width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;background:var(--c);
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.35),0 2px 4px #0009;
}
.sw button[aria-pressed="true"]{box-shadow:inset 0 -3px 5px rgba(0,0,0,.35),0 0 0 3px var(--chassis),0 0 0 5px #fff}
.knobs{display:flex;gap:28px;align-items:flex-end}

/* pads */
.pads{grid-area:pads;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-content:start}
.pad{
  appearance:none;border:0;padding:0;margin:0;aspect-ratio:1;border-radius:8px;position:relative;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,var(--rubber-hi),var(--rubber-lo));color:var(--ink-dim);
  box-shadow:0 5px 0 #0a0a0b,0 7px 12px #000a,inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px #0008;
  transition:transform .04s,box-shadow .04s;
}
.pad::before{content:"";position:absolute;inset:7px;border-radius:5px;background:var(--led);opacity:0;transition:opacity .14s,box-shadow .14s}
.pad.loaded{color:#d8d5ca}
.pad.loaded::before{opacity:.2}
.pad.on::before,.pad.hit::before{opacity:1;box-shadow:0 0 22px 3px var(--led)}
.pad.on,.pad.hit{color:#140d05}
.pad.down{transform:translateY(4px);box-shadow:0 1px 0 #0a0a0b,0 2px 5px #000a,inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px #0008}
.pad.sel{outline:2px solid rgba(255,255,255,.55);outline-offset:3px}
.pad.drop{outline:2px dashed var(--ui);outline-offset:3px}
.pad .num{position:absolute;left:9px;top:7px;z-index:1;font-size:15px;font-weight:700;letter-spacing:.04em}
.pad .key{position:absolute;right:9px;top:8px;z-index:1;font-size:12px;font-weight:600;opacity:.65}
.pad .nm{position:absolute;left:8px;right:8px;bottom:7px;z-index:1;text-align:left;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:none){.pad .key{display:none}}

.hint{margin:0;font-size:14px;line-height:1.45;color:var(--ink-dim);letter-spacing:.02em}
@media (max-width:520px){
  .mpc{padding:14px;gap:14px}
  .pads{gap:8px}
  .brand b{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.pad, .btn, .knob {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#debug {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
  background: #111; color: #0f0; font: 12px/1.35 ui-monospace, Menlo, monospace;
  padding: 8px 12px; max-height: 30vh; overflow: auto;
  display: none; border-bottom: 1px solid #333;
}
#debug.show { display: block; }
#debug .err { color: #f66; }

</style>
</head>
<body>
<div id="debug"></div>
<script>
window.onerror=function(m,u,l){var d=document.getElementById('debug');if(d){d.className='show';d.innerHTML+='<div class="err">ERR: '+m+' (line '+l+')</div>';}return false;};
window.addEventListener('unhandledrejection',function(e){var d=document.getElementById('debug');if(d){d.className='show';d.innerHTML+='<div class="err">PROMISE: '+(e.reason&&e.reason.message||e.reason)+'</div>';}});
</script>
<main class="mpc" id="mpc">
  <header class="top">
    <div class="brand"><b>PAD 16</b><span>SAMPLER</span></div>
    <div class="banks" role="group" aria-label="Банк">
      <button class="btn" data-bank="0" aria-pressed="true">A</button>
      <button class="btn" data-bank="1" aria-pressed="false">B</button>
      <button class="btn" data-bank="2" aria-pressed="false">C</button>
      <button class="btn" data-bank="3" aria-pressed="false">D</button>
    </div>
    <div class="tools">
      <div class="knobcell mini">
        <span class="lab">Master</span>
        <div class="knob" id="kMaster" role="slider" tabindex="0" aria-label="Общая громкость" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      </div>
      <button class="btn" id="stopAll" type="button">Stop all</button>
      <button class="btn" id="lcdTheme" type="button" title="Цвет дисплея">LCD</button>
    </div>
  </header>

  <div class="deck">
    <section class="lcd" id="lcd" data-lcd="green" aria-label="Дисплей">
      <div class="lrow head"><span id="lcdPad">A01</span><span id="lcdName">KICK</span><span id="lcdState">READY</span></div>
      <canvas class="wave" id="wave" aria-hidden="true"></canvas>
      <div class="lrow"><span id="lcdVol">VOL 080</span><span id="lcdPit">PIT +00</span><span id="lcdMode">ONE SHOT</span><span id="lcdChk">CHK --</span></div>
      <div class="lrow"><span id="tEl">T 0.00</span><span id="tLen">LEN 0.00</span><span id="tRem">REM 0.00</span></div>
    </section>

    <section class="pads" id="pads" aria-label="Пэды"></section>

    <section class="ctl" aria-label="Параметры пэда">
      <div class="row">
        <input class="namein" id="nameIn" type="text" maxlength="16" placeholder="Имя пэда" aria-label="Имя пэда" autocomplete="off" spellcheck="false">
        <button class="btn" id="loadBtn" type="button">Load</button>
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="knobs">
        <div class="knobcell">
          <span class="lab">Vol</span>
          <div class="knob" id="kVol" role="slider" tabindex="0" aria-label="Громкость пэда" aria-valuemin="0" aria-valuemax="100"><i></i></div>
          <output id="oVol">80</output>
        </div>
        <div class="knobcell">
          <span class="lab">Pitch</span>
          <div class="knob" id="kPitch" role="slider" tabindex="0" aria-label="Питч, полутона" aria-valuemin="-12" aria-valuemax="12"><i></i></div>
          <output id="oPitch">+0</output>
        </div>
      </div>
      <div class="field">
        <span class="lab">Mode</span>
        <div class="seg" id="modeSeg">
          <button class="btn" data-mode="oneshot" aria-pressed="true">One shot</button>
          <button class="btn" data-mode="gate" aria-pressed="false">Gate</button>
          <button class="btn" data-mode="loop" aria-pressed="false">Loop</button>
        </div>
      </div>
      <div class="field">
        <span class="lab">Choke group</span>
        <div class="seg" id="chokeSeg">
          <button class="btn" data-choke="0" aria-pressed="true">Off</button>
          <button class="btn" data-choke="1" aria-pressed="false">1</button>
          <button class="btn" data-choke="2" aria-pressed="false">2</button>
          <button class="btn" data-choke="3" aria-pressed="false">3</button>
          <button class="btn" data-choke="4" aria-pressed="false">4</button>
        </div>
      </div>
      <div class="field">
        <span class="lab">Цвет</span>
        <div class="sw" id="colorSw"></div>
      </div>
    </section>
  </div>

  <p class="hint">Банк A — демо-звуки. Свои файлы: кнопка <b>Load</b>. Тапай по пэдам.</p>
</main>
<input type="file" id="file" accept="audio/*" multiple hidden>

<script>
(() => {
'use strict';
const N = 16, BANKS = 4, TOTAL = N * BANKS;
const LEDS = ['#ff5a3c', '#ff9a1f', '#f2d63a', '#46dc8c', '#37c6ea', '#e45cd8'];
const CODES = ['KeyZ','KeyX','KeyC','KeyV','KeyA','KeyS','KeyD','KeyF','KeyQ','KeyW','KeyE','KeyR','Digit1','Digit2','Digit3','Digit4'];
const KEYCAP = ['Z','X','C','V','A','S','D','F','Q','W','E','R','1','2','3','4'];
const MODE_LABEL = { oneshot: 'ONE SHOT', gate: 'GATE', loop: 'LOOP' };
const BANK_L = ['A','B','C','D'];
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, rnd = () => Math.random() * 2 - 1;

let ctx = null, master = null, masterVol = 85;
let bank = 0, sel = 0, dirty = true, lcdFg = '#1d2813';
const pads = [], voices = {};

/* ---------- audio ---------- */
function ensureAudio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC({ latencyHint: 'interactive' });
    master = ctx.createGain();
    master.gain.value = mg(masterVol);
    master.connect(ctx.destination);
  }
  if (ctx.state !== 'running') {
    try {
      const p = ctx.resume();
      if (p && typeof p.then === 'function') p.catch(function(){});
    } catch (e) {}
  }
  return true;
}
const mg = v => (v / 100) ** 2;
const gainOf = p => (p.vol / 100) ** 2 * 1.1;
const rateOf = p => Math.pow(2, p.pitch / 12);

function decode(ab) {
  return new Promise((res, rej) => {
    const r = ctx.decodeAudioData(ab, res, rej);
    if (r && r.then) r.then(res, rej);
  });
}
function computePeaks(buf) {
  const d = buf.getChannelData(0), n = 320, out = new Float32Array(n);
  const step = Math.max(1, Math.floor(d.length / n)), hop = Math.max(1, (step / 48) | 0);
  let mx = 0.0001;
  for (let i = 0; i < n; i++) {
    let m = 0; const s = i * step, e = Math.min(d.length, s + step);
    for (let j = s; j < e; j += hop) { const a = Math.abs(d[j]); if (a > m) m = a; }
    out[i] = m; if (m > mx) mx = m;
  }
  for (let i = 0; i < n; i++) out[i] /= mx;
  return out;
}

function posOf(v, p) {
  const dur = p.buffer.duration;
  let pos = v.base + (ctx.currentTime - v.t0) * v.rate;
  if (v.src.loop) pos %= dur;
  return Math.min(pos, dur);
}
function startVoice(g) {
  const p = pads[g];
  stopVoice(g, 0.004);
  const t = ctx.currentTime, r = rateOf(p);
  const src = ctx.createBufferSource();
  src.buffer = p.buffer; src.loop = p.mode === 'loop'; src.playbackRate.value = r;
  const gn = ctx.createGain();
  gn.gain.setValueAtTime(0, t);
  gn.gain.linearRampToValueAtTime(gainOf(p), t + 0.003);
  src.connect(gn); gn.connect(master);
  const v = { src, gn, base: 0, t0: t, rate: r };
  voices[g] = v;
  src.onended = () => { if (voices[g] === v) { delete voices[g]; refreshPad(g); } };
  src.start(t);
  refreshPad(g);
}
function stopVoice(g, rel = 0.025) {
  const v = voices[g]; if (!v) return;
  delete voices[g];
  const t = ctx.currentTime;
  try {
    v.gn.gain.cancelScheduledValues(t);
    v.gn.gain.setValueAtTime(v.gn.gain.value, t);
    v.gn.gain.linearRampToValueAtTime(0, t + rel);
    v.src.stop(t + rel + 0.01);
  } catch (e) {}
  refreshPad(g);
}
function stopAll() { Object.keys(voices).forEach(g => stopVoice(+g, 0.05)); }
function applyLive(g) {
  const v = voices[g], p = pads[g]; if (!v) return;
  const t = ctx.currentTime;
  v.base = posOf(v, p); v.t0 = t; v.rate = rateOf(p);
  v.src.playbackRate.setTargetAtTime(v.rate, t, 0.01);
  v.gn.gain.setTargetAtTime(gainOf(p), t, 0.01);
  v.src.loop = p.mode === 'loop';
}

function press(g) {
  if (!ensureAudio()) { msg('NO WEB AUDIO'); return; }
  select(g);
  const p = pads[g];
  const el = padEls[g % N];
  el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 130);
  if (!p.buffer) { msg('EMPTY - LOAD A FILE'); return; }
  if (p.mode === 'loop' && voices[g]) { stopVoice(g); return; }
  if (p.choke > 0) {
    for (let h = 0; h < TOTAL; h++) if (h !== g && pads[h].choke === p.choke && voices[h]) stopVoice(h, 0.012);
  }
  startVoice(g);
}
function release(g) {
  const p = pads[g];
  if (p.mode === 'gate' && voices[g]) stopVoice(g);
}

/* ---------- demo sounds ---------- */
function synth(len, fn) {
  const sr = ctx.sampleRate, n = Math.floor(len * sr);
  const b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0), st = {};
  for (let i = 0; i < n; i++) d[i] = fn(i / sr, st, sr);
  let m = 0; for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > m) m = a; }
  if (m > 0) { const k = 0.9 / m; for (let i = 0; i < n; i++) d[i] *= k; }
  return b;
}
const hp = (s, key, n) => { const o = n - (s[key] || 0); s[key] = n; return o; };
const DEMOS = [
  ['KICK', 'oneshot', 0, 0, () => synth(.5, (t, s, sr) => { s.ph = (s.ph || 0) + TAU * (46 + 120 * Math.exp(-t * 28)) / sr; return Math.sin(s.ph) * Math.exp(-t * 6.5) + (t < .004 ? rnd() * .3 : 0); })],
  ['SNARE', 'oneshot', 0, 1, () => synth(.3, t => rnd() * Math.exp(-t * 20) * .8 + Math.sin(TAU * 185 * t) * Math.exp(-t * 28) * .6)],
  ['HAT CL', 'oneshot', 1, 2, () => synth(.09, (t, s) => hp(s, 'p', rnd()) * Math.exp(-t * 60))],
  ['HAT OP', 'oneshot', 1, 2, () => synth(.45, (t, s) => hp(s, 'p', rnd()) * Math.exp(-t * 8))],
  ['CLAP', 'oneshot', 0, 1, () => synth(.35, (t, s) => { let e = Math.exp(-t * 14) * .35; for (const k of [0, .011, .022]) if (t >= k) e += Math.exp(-(t - k) * 90) * .5; return hp(s, 'p', rnd()) * e; })],
  ['TOM LO', 'oneshot', 0, 0, () => synth(.5, (t, s, sr) => { s.ph = (s.ph || 0) + TAU * (78 + 60 * Math.exp(-t * 18)) / sr; return Math.sin(s.ph) * Math.exp(-t * 6); })],
  ['TOM HI', 'oneshot', 0, 0, () => synth(.4, (t, s, sr) => { s.ph = (s.ph || 0) + TAU * (150 + 90 * Math.exp(-t * 18)) / sr; return Math.sin(s.ph) * Math.exp(-t * 7.5); })],
  ['RIM', 'oneshot', 0, 2, () => synth(.12, t => Math.sin(TAU * 1700 * t) * Math.exp(-t * 80) + rnd() * Math.exp(-t * 120) * .4)],
  ['COWBELL', 'oneshot', 0, 2, () => synth(.5, t => (Math.sign(Math.sin(TAU * 540 * t)) + Math.sign(Math.sin(TAU * 800 * t))) * .25 * Math.exp(-t * 9))],
  ['CONGA', 'oneshot', 0, 2, () => synth(.35, (t, s, sr) => { s.ph = (s.ph || 0) + TAU * (300 + 40 * Math.exp(-t * 20)) / sr; return Math.sin(s.ph) * Math.exp(-t * 11); })],
  ['ZAP', 'oneshot', 0, 4, () => synth(.3, (t, s, sr) => { s.ph = (s.ph || 0) + TAU * (80 + 2000 * Math.exp(-t * 11)) / sr; return Math.sin(s.ph) * Math.exp(-t * 7); })],
  ['RISER', 'oneshot', 0, 4, () => synth(1.6, (t, s) => hp(s, 'p', rnd()) * Math.pow(t / 1.6, 2))],
  ['BASS LP', 'loop', 0, 3, () => synth(1, t => { let o = 0; for (let k = 1; k <= 6; k++) o += Math.sin(TAU * 55 * k * t) / k; return o * (1 + .3 * Math.sin(TAU * 2 * t)); })],
  ['PAD LP', 'loop', 0, 3, () => synth(2, t => (Math.sin(TAU * 220 * t) + Math.sin(TAU * 262 * t) + Math.sin(TAU * 330 * t)) * (1 + .25 * Math.sin(TAU * 0.5 * t)))],
  ['STAB', 'oneshot', 0, 5, () => synth(.45, t => { let o = 0; for (const f of [220, 262, 330]) o += Math.sin(TAU * f * t) + .5 * Math.sin(TAU * 2 * f * t); return o * Math.exp(-t * 9); })],
  ['BLIP', 'oneshot', 0, 5, () => synth(.12, t => Math.sign(Math.sin(TAU * 880 * t)) * Math.exp(-t * 28))]
];

/* ---------- pads ---------- */
const mkPad = () => ({ name: '', vol: 80, pitch: 0, mode: 'oneshot', choke: 0, color: 0, buffer: null, peaks: null, raw: null, demo: null });
function initPads() {
  for (let g = 0; g < TOTAL; g++) pads.push(mkPad());
  ensureAudio();
  if (!ctx) return;
  DEMOS.forEach((d, i) => {
    const p = pads[i];
    p.name = d[0]; p.mode = d[1]; p.choke = d[2]; p.color = d[3];
    p.buffer = d[4](); p.peaks = computePeaks(p.buffer); p.demo = i;
  });
}
function setPadAudio(g, o) {
  stopVoice(g);
  const p = pads[g];
  p.buffer = o.buffer; p.peaks = computePeaks(o.buffer); p.raw = o.raw || null; p.demo = null;
  if (o.name) p.name = o.name;
  refreshPad(g); if (g === sel) renderSel(); queueSave(g);
}
function clearPad(g) {
  stopVoice(g);
  const p = pads[g];
  p.buffer = null; p.peaks = null; p.raw = null; p.demo = null; p.name = '';
  refreshPad(g); if (g === sel) renderSel(); queueSave(g);
}
async function loadFiles(list, startG) {
  if (!ensureAudio()) return;
  const end = (Math.floor(startG / N) + 1) * N;
  let g = startG, bad = 0, ok = 0;
  for (const f of Array.from(list)) {
    if (g >= end) break;
    const looksAudio = /^(audio|video)\//.test(f.type) || /\.(wav|mp3|m4a|aac|ogg|oga|opus|flac|aif|aiff|caf|webm)$/i.test(f.name);
    if (!looksAudio) { bad++; continue; }
    try {
      const raw = await f.arrayBuffer();
      const buffer = await decode(raw.slice(0));
      setPadAudio(g, { buffer, raw, name: f.name.replace(/\.[^.]+$/, '').slice(0, 16) });
      g++; ok++;
    } catch (e) { bad++; }
  }
  if (bad) msg(ok ? 'SOME FILES SKIPPED' : 'CANNOT READ FILE', 2600);
  else if (ok) msg('LOADED ' + ok, 1400);
}

/* ---------- persistence ---------- */
let db = null;
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('pad16', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('pads');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
function dbAll() {
  return new Promise(res => {
    if (!db) return res({});
    try {
      const out = {}, rq = db.transaction('pads').objectStore('pads').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      rq.onerror = () => res(out);
    } catch (e) { res({}); }
  });
}
function dbPut(k, v) { if (!db) return; try { db.transaction('pads', 'readwrite').objectStore('pads').put(v, k); } catch (e) {} }
const saveT = {};
function queueSave(g) {
  clearTimeout(saveT[g]);
  saveT[g] = setTimeout(() => {
    const p = pads[g];
    dbPut(g, { name: p.name, vol: p.vol, pitch: p.pitch, mode: p.mode, choke: p.choke, color: p.color, has: !!p.buffer, demo: p.demo, raw: p.raw });
  }, 350);
}
async function restore() {
  db = await openDB();
  const all = await dbAll();
  for (const k of Object.keys(all)) {
    const g = +k, r = all[k], p = pads[g]; if (!p) continue;
    p.name = r.name || ''; p.vol = r.vol != null ? r.vol : 80; p.pitch = r.pitch != null ? r.pitch : 0;
    p.mode = r.mode || 'oneshot'; p.choke = r.choke || 0; p.color = r.color || 0;
    if (r.raw) {
      try { const buffer = await decode(r.raw.slice(0)); p.buffer = buffer; p.peaks = computePeaks(buffer); p.raw = r.raw; p.demo = null; } catch (e) {}
    } else if (!r.has) { p.buffer = null; p.peaks = null; p.raw = null; p.demo = null; }
  }
  renderPads(); renderSel();
}
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- UI ---------- */
const padsEl = $('#pads'), padEls = [];
const keyDown = new Map();
function buildPads() {
  for (let row = 3; row >= 0; row--) {
    for (let col = 0; col < 4; col++) {
      const i = row * 4 + col;
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'pad';
      el.innerHTML = '<span class="num">' + String(i + 1).padStart(2, '0') + '</span><span class="key">' + KEYCAP[i] + '</span><span class="nm"></span>';
      // Simple + reliable for iPhone / Yandex Browser
      const getG = () => bank * N + i;
      let pressed = false;

      function doDown() {
        if (pressed) return;
        pressed = true;
        el.classList.add('down');
        el.classList.add('hit');
        setTimeout(function(){ el.classList.remove('hit'); }, 120);
        try { press(getG()); } catch(err) { console.error(err); }
      }
      function doUp() {
        if (!pressed) return;
        pressed = false;
        el.classList.remove('down');
        try { release(getG()); } catch(err) {}
      }

      el.addEventListener('touchstart', function(e) {
        e.preventDefault();
        doDown();
      }, {passive: false});

      el.addEventListener('touchend', function(e) {
        e.preventDefault();
        doUp();
      }, {passive: false});

      el.addEventListener('touchcancel', doUp);

      el.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        doDown();
      });
      el.addEventListener('mouseup', doUp);
      el.addEventListener('mouseleave', doUp);

      el.addEventListener('pointerdown', function(e) {
        if (e.pointerType === 'touch') return;
        if (e.button > 0) return;
        doDown();
      });
      el.addEventListener('pointerup', function(e) {
        if (e.pointerType === 'touch') return;
        doUp();
      });

      el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
      el.addEventListener('dragover', function(e){ e.preventDefault(); el.classList.add('drop'); });
      el.addEventListener('dragleave', function(){ el.classList.remove('drop'); });
      el.addEventListener('drop', function(e) {
        e.preventDefault(); el.classList.remove('drop');
        select(getG());
        if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files, getG());
      });
      padEls[i] = el; padsEl.appendChild(el);
    }
  }
}
function refreshPad(g) {
  dirty = true;
  if (Math.floor(g / N) !== bank) return;
  const i = g % N, p = pads[g], el = padEls[i];
  el.style.setProperty('--led', LEDS[p.color]);
  el.classList.toggle('loaded', !!p.buffer);
  el.classList.toggle('on', !!voices[g]);
  el.classList.toggle('sel', g === sel);
  el.querySelector('.nm').textContent = p.buffer ? (p.name || 'untitled') : '';
  el.setAttribute('aria-label', 'Пэд ' + (i + 1) + (p.buffer ? ', ' + p.name : ', пусто'));
}
function renderPads() { for (let i = 0; i < N; i++) refreshPad(bank * N + i); }
function setBank(b) {
  bank = b; sel = b * N + (sel % N);
  document.querySelectorAll('[data-bank]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.bank === b)));
  renderPads(); renderSel();
}
function select(g) {
  const old = sel; sel = g;
  if (Math.floor(old / N) === bank) refreshPad(old);
  refreshPad(g); renderSel();
}

let msgT = 0;
function msg(text, ms = 1600) {
  $('#lcdState').textContent = text;
  clearTimeout(msgT);
  msgT = setTimeout(renderLCD, ms);
}
function renderLCD() {
  const p = pads[sel];
  $('#lcdPad').textContent = BANK_L[Math.floor(sel / N)] + String(sel % N + 1).padStart(2, '0');
  $('#lcdName').textContent = p.buffer ? (p.name || 'UNTITLED').toUpperCase() : 'EMPTY';
  $('#lcdState').textContent = voices[sel] ? (p.mode === 'loop' ? 'LOOPING' : 'PLAYING') : 'READY';
  $('#lcdVol').textContent = 'VOL ' + String(p.vol).padStart(3, '0');
  $('#lcdPit').textContent = 'PIT ' + (p.pitch < 0 ? '-' : '+') + String(Math.abs(p.pitch)).padStart(2, '0');
  $('#lcdMode').textContent = MODE_LABEL[p.mode];
  $('#lcdChk').textContent = 'CHK ' + (p.choke || '--');
  dirty = true;
}

/* init data before knobs: makeKnob() paints immediately from pads[sel] */
const mv = parseInt(lsGet('pad16.master'), 10);
if (!isNaN(mv)) masterVol = Math.min(100, Math.max(0, mv));
initPads();

/* knobs */
function makeKnob(el, o) {
  const cap = el.querySelector('i'), out = o.out ? $(o.out) : null;
  const paint = () => {
    const v = o.get();
    cap.style.transform = 'rotate(' + (-135 + 270 * (v - o.min) / (o.max - o.min)) + 'deg)';
    el.setAttribute('aria-valuenow', v); el.setAttribute('aria-valuetext', o.fmt(v));
    if (out) out.textContent = o.fmt(v);
  };
  const setv = v => {
    v = Math.round(Math.min(o.max, Math.max(o.min, v)) / o.step) * o.step;
    if (v === o.get()) return;
    o.set(v); paint();
  };
  let y0 = 0, v0 = 0;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.focus({ preventScroll: true });
    y0 = e.clientY; v0 = o.get();
  });
  el.addEventListener('pointermove', e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    setv(v0 + (y0 - e.clientY) / 150 * (o.max - o.min));
  });
  el.addEventListener('dblclick', () => setv(o.def));
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setv(o.get() + o.step);
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setv(o.get() - o.step);
    else if (e.key === 'Home') setv(o.def);
    else return;
    e.preventDefault(); e.stopPropagation();
  });
  paint();
  return { paint };
}
const edit = (key, v) => { const p = pads[sel]; p[key] = v; applyLive(sel); renderLCD(); queueSave(sel); };
const knobs = {
  vol: makeKnob($('#kVol'), { min: 0, max: 100, step: 1, def: 80, out: '#oVol', fmt: v => String(v), get: () => pads[sel].vol, set: v => edit('vol', v) }),
  pitch: makeKnob($('#kPitch'), { min: -12, max: 12, step: 1, def: 0, out: '#oPitch', fmt: v => (v > 0 ? '+' : '') + v, get: () => pads[sel].pitch, set: v => edit('pitch', v) }),
  master: makeKnob($('#kMaster'), {
    min: 0, max: 100, step: 1, def: 85, fmt: v => v + '%', get: () => masterVol,
    set: v => { masterVol = v; if (master) master.gain.setTargetAtTime(mg(v), ctx.currentTime, 0.01); lsSet('pad16.master', v); }
  })
};

function renderSel() {
  const p = pads[sel];
  const ni = $('#nameIn');
  if (document.activeElement !== ni) ni.value = p.name;
  ni.placeholder = p.buffer ? 'Имя пэда' : 'Пусто: нажмите Load';
  knobs.vol.paint(); knobs.pitch.paint(); knobs.master.paint();
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === p.mode)));
  document.querySelectorAll('[data-choke]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.choke === p.choke)));
  document.querySelectorAll('#colorSw button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === p.color)));
  renderLCD();
}

/* wave + time */
const wave = $('#wave'), wctx = wave.getContext('2d');
function sizeWave() {
  const dpr = window.devicePixelRatio || 1, r = wave.getBoundingClientRect();
  wave.width = Math.max(1, Math.round(r.width * dpr)); wave.height = Math.max(1, Math.round(r.height * dpr));
  dirty = true;
}
function drawWave() {
  const W = wave.width, H = wave.height, dpr = window.devicePixelRatio || 1;
  const p = pads[sel], v = voices[sel];
  wctx.clearRect(0, 0, W, H);
  wctx.fillStyle = lcdFg;
  wctx.globalAlpha = .35;
  for (let x = 0; x < W; x += 6 * dpr) wctx.fillRect(x, H / 2 - dpr / 2, 3 * dpr, dpr);
  if (!p.buffer) { wctx.globalAlpha = 1; return; }
  const frac = v ? posOf(v, p) / p.buffer.duration : -1;
  const step = 3 * dpr, bars = Math.floor(W / step);
  for (let b = 0; b < bars; b++) {
    const idx = Math.min(p.peaks.length - 1, Math.floor(b / bars * p.peaks.length));
    const h = Math.max(dpr, p.peaks[idx] * H * .46), x = b * step;
    wctx.globalAlpha = v ? (x / W <= frac ? 1 : .45) : .8;
    wctx.fillRect(x, H / 2 - h, 2 * dpr, 2 * h);
  }
  wctx.globalAlpha = 1;
  if (v) wctx.fillRect(Math.min(W - 2 * dpr, frac * W), 0, 2 * dpr, H);
}
const f2 = n => n.toFixed(2);
function updateTime() {
  const p = pads[sel], v = voices[sel];
  if (!p.buffer) { $('#tEl').textContent = 'T 0.00'; $('#tLen').textContent = 'LEN 0.00'; $('#tRem').textContent = 'REM 0.00'; return; }
  const r = rateOf(p), len = p.buffer.duration / r;
  let el = 0, rem = len;
  if (v) { const pos = posOf(v, p); el = pos / r; rem = (p.buffer.duration - pos) / r; }
  $('#tEl').textContent = 'T ' + f2(el);
  $('#tLen').textContent = 'LEN ' + f2(len);
  $('#tRem').textContent = v && v.src.loop ? 'REM LOOP' : 'REM ' + f2(Math.max(0, rem));
}
function frame() {
  requestAnimationFrame(frame);
  if (!dirty && !voices[sel]) return;
  dirty = false; drawWave(); updateTime();
}

/* LCD theme */
const THEMES = ['green', 'amber', 'ice'];
function setTheme(t) {
  $('#lcd').dataset.lcd = t; lsSet('pad16.lcd', t);
  lcdFg = getComputedStyle($('#lcd')).color; dirty = true;
}

/* ---------- wiring ---------- */
buildPads();
const sw = $('#colorSw');
LEDS.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.style.setProperty('--c', c); b.setAttribute('aria-label', 'Цвет ' + (i + 1)); b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => { pads[sel].color = i; refreshPad(sel); renderSel(); queueSave(sel); });
  sw.appendChild(b);
});
document.querySelectorAll('[data-bank]').forEach(b => b.addEventListener('click', () => setBank(+b.dataset.bank)));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { edit('mode', b.dataset.mode); renderSel(); }));
document.querySelectorAll('[data-choke]').forEach(b => b.addEventListener('click', () => { edit('choke', +b.dataset.choke); renderSel(); }));
$('#nameIn').addEventListener('input', e => { pads[sel].name = e.target.value; refreshPad(sel); renderLCD(); queueSave(sel); });
$('#loadBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { loadFiles(e.target.files, sel); e.target.value = ''; });
$('#clearBtn').addEventListener('click', () => { clearPad(sel); msg('PAD CLEARED'); });
$('#stopAll').addEventListener('click', stopAll);
$('#lcdTheme').addEventListener('click', () => setTheme(THEMES[(THEMES.indexOf($('#lcd').dataset.lcd) + 1) % THEMES.length]));
$('#lcd').addEventListener('dragover', e => e.preventDefault());
$('#lcd').addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files, sel); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || (t.getAttribute && t.getAttribute('role') === 'slider'))) return;
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { setBank((bank + (e.code === 'ArrowRight' ? 1 : 3)) % BANKS); e.preventDefault(); return; }
  if (e.code === 'Escape') { stopAll(); return; }
  const i = CODES.indexOf(e.code);
  if (i < 0 || e.repeat || keyDown.has(i)) return;
  const g = bank * N + i; keyDown.set(i, g);
  padEls[i].classList.add('down'); press(g); e.preventDefault();
});
window.addEventListener('keyup', e => {
  const i = CODES.indexOf(e.code);
  if (i < 0 || !keyDown.has(i)) return;
  const g = keyDown.get(i); keyDown.delete(i);
  padEls[i].classList.remove('down'); release(g);
});
window.addEventListener('blur', () => { keyDown.forEach((g, i) => { padEls[i].classList.remove('down'); release(g); }); keyDown.clear(); });

new ResizeObserver(sizeWave).observe(wave);

/* iOS: unlock audio on a real gesture (touchend/click) */
function unlockAudio() {
  if (!ensureAudio()) return;
  try { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) {}
}
['touchend', 'click', 'mousedown'].forEach(ev => window.addEventListener(ev, unlockAudio, { capture: true, passive: true }));

/* ---------- Telegram Mini App Init ---------- */
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready(); // Сообщаем Telegram, что приложение готово
  tg.expand(); // Раскрываем на весь экран
  
  // Подстраиваем цвета шапки и фона под дизайн сэмплера
  tg.setHeaderColor('#131416');
  tg.setBackgroundColor('#131416');
  
  // Отключаем нативный скроллинг всей страницы, чтобы не мешал интерфейсу
  document.body.style.overflow = 'hidden'; 
}

/* ---------- start ---------- */
const th = lsGet('pad16.lcd');
setTheme(THEMES.includes(th) ? th : 'green');
renderPads(); renderSel(); sizeWave();
requestAnimationFrame(frame);
restore();

/* debug for mobile */
(function(){
  var d = document.getElementById('debug');
  function log(m) {
    if (!d) return;
    d.className = 'show';
    d.innerHTML += '<div>' + m + '</div>';
  }
  try {
    var hasAC = !!(window.AudioContext || window.webkitAudioContext);
    log('Script loaded · AudioContext: ' + (hasAC ? 'yes' : 'NO'));
    if (window.Telegram && window.Telegram.WebApp) {
      log('Telegram WebApp: initialized');
    }
  } catch(e) {}
})();

})();
</script>
